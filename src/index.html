<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">🔐 反在线解压</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="header">
        <h1 data-i18n="app.title">🔐 反在线解压</h1>
        <p class="subtitle" data-i18n="app.subtitle">文件加密混淆工具</p>
    </div>

    <div class="main-content">
        <!-- Tab Bar -->
        <div class="tab-bar" id="tabBar">
            <button class="tab" data-tab="encrypt" data-i18n="tab.encrypt">🔒 加密</button>
            <button class="tab" data-tab="decrypt" data-i18n="tab.decrypt">🔓 解密</button>
        </div>

        <!-- Encrypt Panel -->
        <div class="panel" id="encrypt">
            <div class="file-drop" id="encryptDrop">
                <div class="file-drop-icon">📄</div>
                <div class="file-drop-text">
                    <span data-i18n="encrypt.drop.text">拖拽文件到此处，或 <strong>点击选择文件</strong></span><br />
                    <span style="font-size: 12px; opacity: 0.7" data-i18n="encrypt.drop.hint">支持任意文件类型，不限大小</span>
                </div>
            </div>
            <div class="file-info" id="encryptFileInfo">
                <span class="name" id="encryptFileName"></span>
                <span class="size" id="encryptFileSize"></span>
                <button class="clear-btn" id="encryptClearBtn" data-i18n="encrypt.clear">✕</button>
            </div>
            <button class="btn btn-primary" id="encryptBtn" disabled data-i18n="encrypt.btn">
                🔒 加密文件
            </button>
        </div>

        <!-- Decrypt Panel -->
        <div class="panel" id="decrypt">
            <div class="decrypt-files">
                <div class="decrypt-file-row" id="decryptAodkRow">
                    <div class="label" data-i18n="decrypt.selectKey">① 选择密钥文件</div>
                    <div class="filename empty" id="decryptAodkName" data-i18n="decrypt.keyPlaceholder">
                        点击选择密钥文件
                    </div>
                </div>
                <div class="decrypt-file-row" id="decryptAodfRow">
                    <div class="label" data-i18n="decrypt.selectData">② 选择加密文件</div>
                    <div class="filename empty" id="decryptAodfName" data-i18n="decrypt.dataPlaceholder">
                        点击选择加密文件
                    </div>
                </div>
            </div>
            <button class="btn btn-primary" id="decryptBtn" disabled data-i18n="decrypt.btn">
                🔓 解密文件
            </button>
        </div>

        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
    </div>

    <!-- About & Philosophy -->
    <div class="philosophy-section">
        <h2 data-i18n="about.title">关于本工具</h2>

        <div class="philosophy-card">
            <p data-i18n="philosophy.whatDesc">防止某些网盘对文件的自动扫描……</p>
        </div>

        <h2 data-i18n="why.title">为什么需要反在线解压？</h2>

        <div class="philosophy-card philosophy-problem">
            <h3>⚠️ <span data-i18n="philosophy.problemTitle">传统方案</span></h3>
            <ul>
                <li data-i18n="philosophy.problem.unencrypted">普通文件会被直接扫描，内容完全透明</li>
                <li data-i18n="philosophy.problem.encrypted">带密码的加密压缩包……</li>
            </ul>
        </div>

        <div class="philosophy-card philosophy-solution">
            <h3>🔑 <span data-i18n="philosophy.solution">密钥-数据分离设计</span></h3>
            <ul>
                <li data-i18n="philosophy.solutionDesc1">加密后产生两个文件：<strong>AODK（密钥）</strong> 和
                    <strong>AODF（加密数据）</strong>……
                </li>
                <li data-i18n="philosophy.solutionDesc2">AODK 文件极小……<strong>通过安全渠道单独分享</strong></li>
                <li data-i18n="philosophy.solutionDesc3">AODF 文件可<strong>通过任意渠道自由分发</strong></li>
            </ul>
        </div>
    </div>

    <script type="module" src="bundle.js"></script>
</body>

</html>
